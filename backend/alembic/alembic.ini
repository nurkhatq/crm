# backend/alembic/alembic.ini - Конфигурационный файл Alembic

[alembic]
# Путь к директории скриптов миграций
script_location = alembic

# Шаблон для имен файлов миграций
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Временная зона для миграций
timezone = Europe/Moscow

# Максимальная длина имени файла ревизии
truncate_slug_length = 40

# Уровень логирования
# Можно использовать: CRITICAL, ERROR, WARNING, INFO, DEBUG
sqlalchemy.url = 

[post_write_hooks]
# Форматирование созданных файлов миграций с помощью black
hooks = black
black.type = console_scripts
black.entrypoint = black
black.options = -l 88

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
